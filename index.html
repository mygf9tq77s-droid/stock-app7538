<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Platformer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            touch-action: none;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* сохраняем пропорции 16:9, остальное — чёрные поля */
            background: #87CEEB;
            touch-action: none;
            border-radius: 0;
        }
        #ui {
            position: absolute;
            top: 2%;
            left: 2%;
            right: 2%;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: clamp(16px, 3vmin, 28px);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            padding: 0 5px;
            z-index: 5;
        }
        #ui span {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        #restartBtn {
            position: absolute;
            bottom: 3%;
            right: 3%;
            background: #e94560;
            border: none;
            color: white;
            font-size: clamp(14px, 2vmin, 22px);
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            z-index: 10;
        }
        #restartBtn:active { transform: scale(0.95); }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(24px, 5vmin, 48px);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 20px;
            display: none;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <span id="levelDisplay">Уровень 1</span>
        <span id="scoreDisplay">🪙 0</span>
    </div>
    <button id="restartBtn">🔄 Рестарт</button>
    <div id="message"></div>
</div>
<script>
// ============================================================
//   ИНИЦИАЛИЗАЦИЯ
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const levelDisplay = document.getElementById('levelDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restartBtn');

// Логический размер игрового поля (16:9)
const W = 960;
const H = 540;
canvas.width = W;
canvas.height = H;

// ============================================================
//   НАСТРОЙКИ
// ============================================================
const TILE = 32;
const PLAYER_W = 24;
const PLAYER_H = 32;
const GRAVITY = 0.6;
const JUMP_FORCE = -12;
const MOVE_SPEED = 4;
const MAX_LEVEL = 5;

// ============================================================
//   УРОВНИ (TileMap) — исправлены: S теперь стоит на платформе
// ============================================================
const LEVELS = [
    // Уровень 1
    [
        "                              ",
        "                              ",
        "                              ",
        "          C                   ",
        "     P           P            ",
        "   C        C          C      ",
        "  #   C       #  C            ",
        "  #        C     #            ",
        "  #   E          #   E        ",
        "  #              #            ",
        "  ################   C   F    ",
        "  ##########S#######   #   #  "  // S вставлен в платформу
    ],
    // Уровень 2
    [
        "                              ",
        "                              ",
        "                              ",
        "        C                C    ",
        "    P        P     P          ",
        "  C      C        C      C    ",
        "  #   C      #  C             ",
        "  #           #    E          ",
        "  #   E       #          E    ",
        "  #           #               ",
        "  #############   C   F       ",
        "  #####S#########   #   #     "  // S на платформе
    ],
    // Уровень 3
    [
        "                              ",
        "                              ",
        "                              ",
        "      C            C          ",
        "   P       P   P       P      ",
        " C    C        C        C     ",
        " #  C      #  C               ",
        " #    E    #      E           ",
        " #         #    E             ",
        " #         #                  ",
        " ##########    C   F          ",
        " ###S#######   #   #          "  // S на платформе
    ],
    // Уровень 4
    [
        "                              ",
        "                              ",
        "                              ",
        "  C          C         C      ",
        "   P    P        P            ",
        "       C     C       C        ",
        " #    E    #   E              ",
        " #         #      E           ",
        " #         #    E    E        ",
        " #    E    #                  ",
        " #########     C   F          ",
        " ####S####       #   #        "  // S на платформе
    ],
    // Уровень 5
    [
        "                              ",
        "                              ",
        "                              ",
        "   C        C     C     C     ",
        "  P   P     P  P  P  P        ",
        " C    C  C    C    C    C     ",
        " #  E    #   E  E             ",
        " #       #    E    E          ",
        " #   E   #    E    E          ",
        " #       #                    ",
        " #########    C   F           ",
        " ####S####    #   #           "  // S на платформе
    ]
];

// ============================================================
//   ИГРОВОЕ СОСТОЯНИЕ
// ============================================================
let currentLevel = 0;
let score = 0;
let gameRunning = true;
let respawning = false;

let platforms = [];
let enemies = [];
let coins = [];
let finish = null;
let player = { x: 0, y: 0, w: PLAYER_W, h: PLAYER_H, vx: 0, vy: 0, onGround: false };
let startPos = { x: 0, y: 0 };
let camera = { x: 0, y: 0 };

// Джойстики
let leftJoystick = { active: false, dx: 0, dy: 0 };
let rightJoystick = { active: false };
let jumpRequested = false;

const JOYSTICK_RADIUS = 50;

// ============================================================
//   ЗАГРУЗКА УРОВНЯ
// ============================================================
function loadLevel(levelIndex) {
    const map = LEVELS[levelIndex];
    if (!map) return;

    platforms = [];
    enemies = [];
    coins = [];
    finish = null;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    respawning = false;
    messageEl.style.display = 'none';

    const rows = map.length;
    const cols = map[0].length;

    for (let row = 0; row < rows; row++) {
        const line = map[row];
        for (let col = 0; col < cols; col++) {
            const ch = line[col];
            const x = col * TILE;
            const y = row * TILE;

            switch(ch) {
                case '#':
                    platforms.push({ x, y, w: TILE, h: TILE });
                    break;
                case 'P':
                    platforms.push({ x, y, w: TILE, h: TILE/2 });
                    break;
                case 'E':
                    enemies.push({ x, y, w: 24, h: 24, vx: 1.2, startX: x, endX: x + 80, alive: true });
                    break;
                case 'C':
                    coins.push({ x: x+4, y: y+4, w: 24, h: 24, collected: false });
                    break;
                case 'F':
                    finish = { x, y, w: TILE, h: TILE };
                    break;
                case 'S':
                    startPos.x = x;
                    startPos.y = y;
                    player.x = x;
                    player.y = y;
                    break;
            }
        }
    }

    // Коррекция: если под игроком нет платформы, опускаем на ближайшую снизу
    let found = false;
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (p.y >= player.y + player.h) {
                // Платформа ниже
                const dist = p.y - (player.y + player.h);
                if (dist < 100) { // если близко
                    player.y = p.y - player.h;
                    found = true;
                    break;
                }
            }
        }
    }
    if (!found) {
        // Если нет платформы под ногами, ищем самую верхнюю платформу и ставим на неё
        let highest = null;
        for (let p of platforms) {
            if (p.x + p.w > player.x && p.x < player.x + player.w) {
                if (!highest || p.y < highest.y) {
                    highest = p;
                }
            }
        }
        if (highest) {
            player.y = highest.y - player.h;
        }
    }

    levelDisplay.textContent = `Уровень ${levelIndex+1}`;
    scoreDisplay.textContent = `🪙 ${score}`;
}

// ============================================================
//   ФИЗИКА И КОЛЛИЗИИ
// ============================================================
function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function respawnPlayer() {
    // Возрождаем на стартовой позиции без потери монет и прогресса
    player.x = startPos.x;
    player.y = startPos.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    // Корректируем позицию, чтобы не провалиться
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (p.y >= player.y + player.h) {
                const dist = p.y - (player.y + player.h);
                if (dist < 100) {
                    player.y = p.y - player.h;
                    break;
                }
            }
        }
    }
    respawning = false;
}

function updatePlayer() {
    if (!gameRunning || respawning) return;

    let moveX = leftJoystick.active ? leftJoystick.dx : 0;
    player.vx = moveX * MOVE_SPEED;

    if (jumpRequested && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        jumpRequested = false;
    }

    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;

    // Перемещение по X
    player.x += player.vx;
    for (let p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            player.vx = 0;
        }
    }

    // Перемещение по Y
    player.y += player.vy;
    player.onGround = false;
    for (let p of platforms) {
        if (rectCollide(player, p)) {
            if (player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    }

    // Границы уровня
    const cols = LEVELS[currentLevel][0].length;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > cols * TILE) {
        player.x = cols * TILE - player.w;
    }

    // Падение в пропасть -> респавн
    if (player.y > 700) {
        respawning = true;
        setTimeout(respawnPlayer, 300);
        return;
    }

    // Сбор монет
    for (let coin of coins) {
        if (!coin.collected && rectCollide(player, coin)) {
            coin.collected = true;
            score += 10;
            scoreDisplay.textContent = `🪙 ${score}`;
        }
    }

    // Враги
    for (let enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.startX || enemy.x + enemy.w >= enemy.endX) {
            enemy.vx *= -1;
        }

        if (rectCollide(player, enemy)) {
            if (player.vy > 0 && player.y + player.h - enemy.y < 20) {
                enemy.alive = false;
                player.vy = -6;
            } else {
                // Смерть от врага -> респавн
                respawning = true;
                setTimeout(respawnPlayer, 300);
                return;
            }
        }
    }

    // Финиш
    if (finish && rectCollide(player, finish)) {
        if (currentLevel < MAX_LEVEL - 1) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            messageEl.textContent = '🏆 ПОБЕДА! Все уровни пройдены!';
            messageEl.style.display = 'block';
            gameRunning = false;
        }
    }
}

// ============================================================
//   ОТРИСОВКА
// ============================================================
function draw() {
    ctx.clearRect(0, 0, W, H);

    const rows = LEVELS[currentLevel].length;
    const cols = LEVELS[currentLevel][0].length;

    // Камера
    let camX = player.x - W/2 + player.w/2;
    camX = Math.max(0, Math.min(camX, cols * TILE - W));
    camera.x = camX;

    ctx.save();
    ctx.translate(-camera.x, 0);

    // Тайлы
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            const ch = LEVELS[currentLevel][row][col];
            const x = col * TILE, y = row * TILE;
            if (ch === '#') {
                ctx.fillStyle = '#654321';
                ctx.fillRect(x, y, TILE, TILE);
                ctx.strokeStyle = '#3e2a1a';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, TILE, TILE);
            } else if (ch === 'P') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x, y, TILE, TILE/2);
                ctx.strokeStyle = '#5a2d0c';
                ctx.strokeRect(x, y, TILE, TILE/2);
            }
        }
    }

    // Монеты
    for (let coin of coins) {
        if (coin.collected) continue;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, 12, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#FFA500';
        ctx.beginPath();
        ctx.arc(coin.x + coin.w/2, coin.y + coin.h/2, 8, 0, Math.PI*2);
        ctx.fill();
    }

    // Враги
    for (let enemy of enemies) {
        if (!enemy.alive) continue;
        ctx.fillStyle = '#e94560';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(enemy.x+4, enemy.y-4, 6, 6);
        ctx.fillRect(enemy.x+14, enemy.y-4, 6, 6);
        ctx.fillStyle = '#fff';
        ctx.fillRect(enemy.x+6, enemy.y+6, 4, 4);
        ctx.fillRect(enemy.x+14, enemy.y+6, 4, 4);
    }

    // Финиш
    if (finish) {
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(finish.x, finish.y, finish.w, finish.h);
        ctx.fillStyle = '#27ae60';
        ctx.font = '24px Arial';
        ctx.fillText('🏁', finish.x+4, finish.y+28);
    }

    // Игрок
    ctx.fillStyle = '#3498db';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#2980b9';
    ctx.fillRect(player.x+4, player.y-6, 6, 6);
    ctx.fillRect(player.x+14, player.y-6, 6, 6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x+6, player.y+8, 4, 4);
    ctx.fillRect(player.x+14, player.y+8, 4, 4);

    ctx.restore();

    // Джойстики
    drawJoysticks();
}

// ============================================================
//   ОТРИСОВКА ДЖОЙСТИКОВ
// ============================================================
function drawJoysticks() {
    const cx = 100, cy = H - 120;
    const rx = W - 100, ry = H - 120;

    ctx.beginPath();
    ctx.arc(cx, cy, JOYSTICK_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (leftJoystick.active) {
        const dx = leftJoystick.dx * JOYSTICK_RADIUS * 0.6;
        const dy = leftJoystick.dy * JOYSTICK_RADIUS * 0.6;
        ctx.beginPath();
        ctx.arc(cx + dx, cy + dy, 20, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(rx, ry, JOYSTICK_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('▲', rx, ry-2);
}

// ============================================================
//   ОБРАБОТЧИКИ ВВОДА
// ============================================================
function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function handleTouchStart(e) {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        const pos = getCanvasCoords(touch.clientX, touch.clientY);
        if (pos.x < W/2) {
            leftJoystick.active = true;
            updateJoystick(pos.x, pos.y);
        } else {
            jumpRequested = true;
            rightJoystick.active = true;
        }
    }
}

function handleTouchMove(e) {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        const pos = getCanvasCoords(touch.clientX, touch.clientY);
        if (leftJoystick.active && pos.x < W/2) {
            updateJoystick(pos.x, pos.y);
        }
    }
}

function handleTouchEnd(e) {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        const pos = getCanvasCoords(touch.clientX, touch.clientY);
        if (leftJoystick.active && pos.x < W/2) {
            leftJoystick.active = false;
            leftJoystick.dx = 0;
        }
        if (rightJoystick.active && pos.x >= W/2) {
            rightJoystick.active = false;
            jumpRequested = false;
        }
    }
    if (e.touches.length === 0) {
        leftJoystick.active = false;
        leftJoystick.dx = 0;
        rightJoystick.active = false;
        jumpRequested = false;
    }
}

function updateJoystick(cx, cy) {
    const centerX = 100, centerY = H - 120;
    let dx = cx - centerX;
    let dy = cy - centerY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const maxDist = JOYSTICK_RADIUS;
    if (dist > maxDist) {
        dx = dx / dist * maxDist;
        dy = dy / dist * maxDist;
    }
    let normX = dx / maxDist;
    let normY = dy / maxDist;
    if (Math.abs(normX) < 0.1 && Math.abs(normY) < 0.1) {
        normX = 0; normY = 0;
    }
    leftJoystick.dx = normX;
    leftJoystick.dy = normY;
}

// Мышь (для ПК)
let mouseDown = false;
canvas.addEventListener('mousedown', (e) => {
    const pos = getCanvasCoords(e.clientX, e.clientY);
    mouseDown = true;
    if (pos.x < W/2) {
        leftJoystick.active = true;
        updateJoystick(pos.x, pos.y);
    } else {
        jumpRequested = true;
        rightJoystick.active = true;
    }
});
canvas.addEventListener('mousemove', (e) => {
    if (!mouseDown) return;
    const pos = getCanvasCoords(e.clientX, e.clientY);
    if (leftJoystick.active && pos.x < W/2) {
        updateJoystick(pos.x, pos.y);
    }
});
canvas.addEventListener('mouseup', () => {
    mouseDown = false;
    leftJoystick.active = false;
    leftJoystick.dx = 0;
    rightJoystick.active = false;
    jumpRequested = false;
});

// Touch
canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// ============================================================
//   РЕСТАРТ
// ============================================================
restartBtn.addEventListener('click', () => {
    currentLevel = 0;
    score = 0;
    gameRunning = true;
    loadLevel(currentLevel);
});

// ============================================================
//   ЗАПУСК
// ============================================================
function gameLoop() {
    if (gameRunning) updatePlayer();
    draw();
    requestAnimationFrame(gameLoop);
}

loadLevel(0);
gameLoop();
</script>
</body>
</html>
