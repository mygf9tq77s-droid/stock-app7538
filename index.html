<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Учёт утеплителя</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; padding: 15px; max-width: 600px; margin: 0 auto; background: #f7f7f7; }
    h2 { margin-top: 0; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .form-row input, .form-row select { flex: 1 1 100px; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .form-row button { flex: 0 0 auto; padding: 8px 20px; background: #007aff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th { background: #e9ecef; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .editable { cursor: pointer; background: #f0f8ff; padding: 4px 8px; border-radius: 4px; display: inline-block; min-width: 40px; }
    .editable:hover { background: #d4edff; }
    .btn-del { background: #ff3b30; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .filter-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>📦 Учёт утеплителя</h2>

  <!-- Форма добавления -->
  <div class="form-row">
    <select id="density">
      <option value="150">150 гр</option>
      <option value="200">200 гр</option>
      <option value="300">300 гр</option>
      <option value="400">400 гр</option>
      <option value="500">500 гр</option>
    </select>
    <select id="thickness">
      <option value="5">5 мм</option>
      <option value="8">8 мм</option>
      <option value="10">10 мм</option>
      <option value="15">15 мм</option>
      <option value="20">20 мм</option>
      <option value="30">30 мм</option>
      <option value="50">50 мм</option>
    </select>
    <input type="number" id="width" placeholder="Ширина (мм)" value="150" step="any" />
    <input type="number" id="qty" placeholder="Кол-во (шт)" value="0" step="1" />
    <button onclick="addItem()">➕ Добавить</button>
  </div>

  <!-- Фильтр -->
  <div class="filter-row">
    <input type="text" id="filter" placeholder="Фильтр (например, 300гр 20мм)" oninput="renderTable()" />
  </div>

  <!-- Таблица -->
  <table id="stockTable">
    <thead>
      <tr><th>Плотность</th><th>Толщина</th><th>Ширина</th><th>Кол-во</th><th></th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    let items = JSON.parse(localStorage.getItem('stockItems')) || [];

    function renderTable() {
      const filter = document.getElementById('filter').value.toLowerCase();
      const filtered = items.filter(item => {
        const str = `${item.density}гр ${item.thickness}мм шир.${item.width}мм`.toLowerCase();
        return str.includes(filter);
      });

      const tbody = document.getElementById('tableBody');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">Нет записей</td></tr>`;
      } else {
        tbody.innerHTML = filtered.map((item, idx) => {
          const realIdx = items.indexOf(item);
          return `
            <tr>
              <td>${item.density} гр</td>
              <td>${item.thickness} мм</td>
              <td>
                <span class="editable" onclick="editField(${realIdx}, 'width')">${item.width}</span> мм
              </td>
              <td>
                <span class="editable" onclick="editField(${realIdx}, 'qty')">${item.qty}</span> шт
              </td>
              <td><button class="btn-del" onclick="deleteItem(${realIdx})">✕</button></td>
            </tr>
          `;
        }).join('');
      }

      localStorage.setItem('stockItems', JSON.stringify(items));
    }

    function addItem() {
      const density = parseInt(document.getElementById('density').value);
      const thickness = parseInt(document.getElementById('thickness').value);
      const width = parseFloat(document.getElementById('width').value) || 0;
      const qty = parseInt(document.getElementById('qty').value) || 0;
      if (width <= 0 || qty <= 0) {
        alert('Ширина и количество должны быть положительными');
        return;
      }

      // Поиск существующей записи с такими же характеристиками
      const existing = items.find(item => 
        item.density === density && 
        item.thickness === thickness && 
        item.width === width
      );

      if (existing) {
        existing.qty += qty;
      } else {
        items.push({ density, thickness, width, qty });
      }

      renderTable();
      document.getElementById('qty').value = '';
      document.getElementById('width').value = '150';
    }

    function deleteItem(index) {
      if (confirm('Удалить запись?')) {
        items.splice(index, 1);
        renderTable();
      }
    }

    function editField(index, field) {
      const newVal = prompt(`Введите новое значение для ${field === 'width' ? 'ширины' : 'количества'}`, items[index][field]);
      if (newVal === null) return;
      const num = parseFloat(newVal);
      if (isNaN(num) || num < 0) {
        alert('Введите положительное число');
        return;
      }
      items[index][field] = num;
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
