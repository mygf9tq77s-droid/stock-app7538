<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лови шары!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        .game-wrapper {
            background: #16213e;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 500px;
        }
        canvas {
            display: block;
            background: #0f3460;
            border-radius: 12px;
            width: 100%;
            height: auto;
            aspect-ratio: 600 / 400;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #eee;
            font-size: 20px;
            padding: 10px 0 0 0;
        }
        #restartBtn {
            background: #e94560;
            border: none;
            color: white;
            font-size: 18px;
            padding: 6px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        #restartBtn:hover { background: #c73e54; transform: scale(1.05); }
        #score { font-weight: bold; color: #f5c842; }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="info">
        <span>🎯 Счёт: <span id="score">0</span></span>
        <button id="restartBtn">🔄 Заново</button>
    </div>
</div>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('score');

    // Размеры игрового поля (логические 600x400)
    const W = 600, H = 400;
    canvas.width = W; canvas.height = H;

    // Настройки
    const BASKET_WIDTH = 80;
    const BASKET_HEIGHT = 30;
    const BALL_RADIUS = 15;
    const FALL_SPEED = 1.8;
    const SPAWN_INTERVAL = 28;

    // Состояние
    let basketX = (W - BASKET_WIDTH) / 2;
    let score = 0;
    let gameOver = false;
    let balls = [];
    let frameCount = 0;

    function updateScoreDisplay() {
        scoreSpan.textContent = score;
    }

    function spawnBall() {
        const x = Math.random() * (W - 2 * BALL_RADIUS) + BALL_RADIUS;
        const y = -BALL_RADIUS;
        const colors = ['#e94560','#f5c842','#4ecca3','#6c5ce7','#fd79a8','#00cec9'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        balls.push({ x, y, radius: BALL_RADIUS, color, speed: FALL_SPEED + Math.random() * 0.5 });
    }

    function checkCollision(ball) {
        const basketY = H - BASKET_HEIGHT - 10;
        const rx = basketX, ry = basketY, rw = BASKET_WIDTH, rh = BASKET_HEIGHT;
        const cx = ball.x, cy = ball.y;
        const nearestX = Math.max(rx, Math.min(cx, rx + rw));
        const nearestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - nearestX, dy = cy - nearestY;
        return (dx*dx + dy*dy) < (ball.radius * ball.radius);
    }

    function update() {
        if (gameOver) return;
        frameCount++;
        if (frameCount % SPAWN_INTERVAL === 0) spawnBall();

        for (let i = balls.length-1; i >= 0; i--) {
            const ball = balls[i];
            ball.y += ball.speed;
            // Столкновение с корзиной
            if (ball.y + ball.radius >= H - BASKET_HEIGHT - 10 && ball.y - ball.radius <= H - 10) {
                if (checkCollision(ball)) {
                    score++;
                    updateScoreDisplay();
                    balls.splice(i,1);
                    continue;
                }
            }
            if (ball.y - ball.radius > H) {
                gameOver = true;
                balls = [];
                break;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        // фон
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0, 0, W, H);
        // шары
        for (const ball of balls) {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = ball.color;
            ctx.shadowColor = 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            // блик
            ctx.beginPath();
            ctx.arc(ball.x-4, ball.y-4, 4, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fill();
        }
        // корзина
        const basketY = H - BASKET_HEIGHT - 10;
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.roundRect(basketX, basketY, BASKET_WIDTH, BASKET_HEIGHT, 8);
        ctx.fill();
        ctx.strokeStyle = '#dfe6e9';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(basketX, basketY, BASKET_WIDTH, BASKET_HEIGHT, 8);
        ctx.stroke();
        ctx.shadowBlur = 0;
        // если gameOver — надпись
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, H/2-40, W, 80);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('💥 Игра окончена', W/2, H/2+12);
        }
    }

    // ---- Управление ----
    function handleMove(clientX) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;   // отношение логической ширины к фактической
        const canvasX = (clientX - rect.left) * scaleX;
        let newX = canvasX - BASKET_WIDTH/2;
        newX = Math.max(0, Math.min(W - BASKET_WIDTH, newX));
        basketX = newX;
    }

    // Мышь
    canvas.addEventListener('mousemove', (e) => {
        if (!gameOver) handleMove(e.clientX);
    });
    // Touch
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!gameOver) {
            const touch = e.touches[0];
            handleMove(touch.clientX);
        }
    }, { passive: false });
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameOver) {
            const touch = e.touches[0];
            handleMove(touch.clientX);
        }
    }, { passive: false });

    // Кнопка рестарта
    document.getElementById('restartBtn').addEventListener('click', () => {
        gameOver = false;
        balls = [];
        score = 0;
        updateScoreDisplay();
        basketX = (W - BASKET_WIDTH) / 2;
        frameCount = 0;
    });

    // ---- Игровой цикл ----
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // полифил для roundRect, если браузер старый
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    }
</script>
</body>
</html>
